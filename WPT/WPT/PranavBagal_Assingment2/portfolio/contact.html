<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Pranav.dev</title><link rel="stylesheet" href="../portfolio/style.css"></head><body>
<header id="main-nav"><div class="brand"><img src="../portfolio/images/logo.svg" alt="PB logo" width="42" height="42"><strong>Pranav.dev</strong></div><nav><a href="index.html">Home</a><a href="projects.html">Projects</a><a href="contact.html">Contact</a><a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></nav></header>
<main class="page narrow"><h1>Contact me</h1><form class="contact-form" id="contactForm" action="#" method="post" onsubmit="return validate()">
<label for="name">Name</label><input id="name" name="name" onkeyup="checkName()" placeholder="Your name"><span id="nameError" class="error-span"></span>
<label for="email">Email</label><input id="email" name="email" onkeyup="checkEmail()" placeholder="you@example.com"><span id="emailError" class="error-span"></span>
<label for="phone">Phone</label><input id="phone" name="phone" placeholder="10 digit phone"><span id="phoneError" class="error-span"></span>
<label for="date">Preferred contact date</label><input id="date" name="date" type="date">
<label for="type">Enquiry type</label><select id="type" name="type"><option value="">Choose one</option><option>Job opportunity</option><option>Project collaboration</option><option>General enquiry</option></select>
<label for="mode">Preferred contact mode</label><select id="mode" name="mode"><option>Email</option><option>Phone</option></select>
<label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span id="messageError" class="error-span"></span>
<label for="cv">CV upload (optional)</label><input id="cv" name="cv" type="file">
<label><input type="checkbox" id="consent" required> I agree to be contacted.</label>
<button type="submit">Send message</button><button type="reset" class="secondary">Reset</button>
</form><p id="thankYou"></p></main><footer>© 2026 Pranav Bagal</footer><script src="js/contact.js"></script></body></html>
