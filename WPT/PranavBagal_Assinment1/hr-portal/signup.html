<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form class="loginfrm">
        <h2>Create Account</h2>
        <input class="inputvalue" type="text" name="name" placeholder="Full Name" required>
        <br><br>

        <input class="inputvalue" type="email"name="email" placeholder="Email Address" required>
        <br><br>

        <input class="inputvalue" type="password"name="password" placeholder="Password" required>
        <br><br>

        <button class="login" type="submit">Sign Up</button>

        <p class="signup-link">Already have an account?
            <a href="login.html">Login</a>
        </p>
    </form>
</body>
</html>
