<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="head">
        <div class="brand">
            <img src="images/pranav.jpg" alt="Pranav image" width="60">
            <span id="pranav_portfolio">
                <u>Pranav's Portfolio</u>
            </span>
        </div>

        <nav id="head_nav">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contacts</a>
            <button id="lightMode">Dark Mode</button>
        </nav>
    </header>

    <form action="https://example.com/submit-contact"
          method="post"
          enctype="multipart/form-data">

        <div class="ContactForm">

            <h1>Contact Me</h1>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your Name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="abc@gmail.com" required><br><br>

            <label for="date">Preferred Contact Date:</label>
            <input type="date" id="date" name="contactDate" required><br><br>

            <label for="enquiry">Enquiry Type:</label>
            <select id="enquiry" name="enquiryType" required>
                <option value="">---Select option---</option>
                <option value="job">Job</option>
                <option value="internship">Internships</option>
                <option value="project">Projects Discussion</option>
                <option value="other">Other</option>
            </select><br><br>

            <label>Preferred Contact Mode:</label><br>
            <input type="radio" id="emailMode" name="contactMode" value="email" required>
            <label>Email</label>

            <input type="radio" id="phoneMode" name="contactMode" value="phone">
            <label for="phoneMode">Phone</label>

            <input type="radio" id="videoMode" name="contactMode" value="video">
            <label for="videoMode">Video Call</label><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" placeholder="Enter your message" required></textarea><br><br>

            <label for="cv">Upload CV:</label>
            <input type="file" id="cv" name="cv" accept=".pdf"><br><br>

            <input type="checkbox" id="consent" name="consent" value="yes" required>
            <label>I agree to be contacted regarding my enquiry.</label><br><br>

            <button type="submit" id="btn">Submit</button>
            <button type="reset" id="btn">Reset</button>
        </div>
    </form>

    <!-- Map of Navi Mumbai -->
    <div class="map">
        <h2>My City - Navi Mumbai</h2>

        <iframe
            id="city-map"
            title="Map of Navi Mumbai"
            src="https://maps.google.com/maps?q=19.014462,73.094633&z=15&output=embed"
            width="100%"
            height="550"
            loading="lazy">
        </iframe>
    </div>
    <script src="js/index.js" defer></script>
</body>
</html>
