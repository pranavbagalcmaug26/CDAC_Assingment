<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact | Pranav.dev</title><link rel="stylesheet" href="style.css"></head>
<body>
<header id="main-nav"><div class="brand"><img src="images/logo.svg" alt="PB logo" width="42" height="42"><strong>Pranav.dev</strong></div><nav><a href="index.html">Home</a><a href="projects.html">Projects</a><a href="contact.html">Contact</a><a href="https://github.com/" target="_blank" rel="noopener">GitHub</a></nav></header>
<main class="page narrow"><h1>Let's connect</h1><p>Have a project idea or opportunity? Send a message.</p>
<form class="contact-form" action="https://example.com/contact" method="post" enctype="multipart/form-data">
<label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your full name" required>
<label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" required>
<label for="date">Preferred contact date</label><input id="date" name="date" type="date" required>
<label for="type">Enquiry type</label><select id="type" name="type" required><option value="">Choose one</option><option>Job opportunity</option><option>Project collaboration</option><option>General enquiry</option></select>
<fieldset><legend>Preferred contact mode</legend><label><input type="radio" name="contactMode" value="email" required> Email</label><label><input type="radio" name="contactMode" value="phone"> Phone</label></fieldset>
<label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Write your message"></textarea>
<label for="cv">CV upload (optional)</label><input id="cv" name="cv" type="file" accept=".pdf,.doc,.docx">
<label class="check"><input id="consent" name="consent" type="checkbox" required> I agree to be contacted about this enquiry.</label>
<div class="actions"><button type="submit">Submit</button><button type="reset" class="secondary">Reset</button></div>
</form>
<h2>Find Navi Mumbai</h2><iframe title="Map of Navi Mumbai" src="https://www.google.com/maps?q=Navi%20Mumbai&output=embed" width="100%" height="280" loading="lazy"></iframe>
</main><footer>© 2026 Pranav Bagal</footer></body></html>
