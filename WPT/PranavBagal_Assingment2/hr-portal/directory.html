<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechNova Employee Directory</title><link rel="stylesheet" href="style.css"></head><body><nav><a href="login.html">Login</a><a href="directory.html">Directory</a><a href="onboarding.html">Onboarding</a></nav><main><h1>Employee Directory</h1><button onclick="loadEmployees()">Load employees</button><p id="directoryStatus" class="status"></p><div class="toolbar"><div><label for="searchField">Search by</label><select id="searchField" onchange="renderEmployees()"><option value="name">Name</option><option value="email">Email</option><option value="username">Username</option></select></div><div><label for="searchText">Search</label><input id="searchText" onkeyup="renderEmployees()" placeholder="Type to search"></div></div><table><thead><tr><th>ID</th><th>Name</th><th>Username</th><th>Email</th><th>Phone</th><th>Department</th><th>Action</th></tr></thead><tbody id="employeeRows"></tbody></table><p id="totalEmployees">Total employees: 0</p><h2>Add employee</h2><form onsubmit="return addEmployee()"><label for="newName">Name</label><input id="newName" required><label for="newDepartment">Department</label><input id="newDepartment" required><button type="submit">Add employee</button></form></main><script src="js/directory.js"></script></body></html>
